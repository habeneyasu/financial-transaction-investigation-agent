[project]
name = "financial-transaction-investigation-agent"
version = "0.1.0"
description = "AI-powered financial transaction investigation agent"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20.0",
    "mcp[cli]==2.2.0",
    "httpx2>=2.12.0,<3",
    "pydantic-settings>=2.15.0",
    "gradio>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[dependency-groups]
dev = [
    "bcrypt>=4.2.0",
    "pyyaml>=6.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
